<style>
    /* PC / Mobile 분기 (768px 기준) */
    .pcver { display: block; }
    .mover { display: none; }

    @media (max-width: 768px) {
        .pcver { display: none; }
        .mover { display: block; }
    }

    /* 여백 제거 핵심 */
    .event-video-section {
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .event-video-wrap {
        position: relative;
        width: 100%;
        max-width: 1902px;
        margin: 0 auto;     /* 상하 여백 제거 */
        padding: 0;
        background: #000;
        overflow: hidden;
        line-height: 0;    /* 이미지/비디오 위 공백 제거 */
    }

    @media (max-width: 768px) {
        .event-video-wrap { max-width: 1024px; }
    }

    .event-video {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
        margin: 0;
        padding: 0;
    }

    /* PNG 오버레이 */
    .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        z-index: 2;
        pointer-events: none;
        display: block;     /* 이미지 기본 여백 제거 */
    }

    .event-video-fallback {
        display: none;
        width: 100%;
        padding-top: 56.25%;
        background: #000;
    }

    .event-video-wrap.is-error .event-video { display: none; }
    .event-video-wrap.is-error .event-video-fallback { display: block; }

</style>

<script>
    (function () {
        var wraps = document.querySelectorAll('.event-video-wrap');

        wraps.forEach(function (wrap) {
            var v = wrap.querySelector('video');
            if (!v) return;

            var tryPlay = function () {
                var p = v.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function(){});
                }
            };

            v.addEventListener('loadedmetadata', tryPlay);
            v.addEventListener('canplay', tryPlay);

            v.addEventListener('error', function () {
                wrap.classList.add('is-error');
                console.log('[video error]', v.currentSrc, v.error);
            });
        });
    })();
</script>
